server:
  port: 8080

spring:
  application:
    name: kunlun-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/kunlun_chishu?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 12345678
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

# 算法参数默认配置
kunlun:
  algorithm:
    alpha-range:
      min: 0.01
      max: 0.99
      step: 0.01
    default-service-level: 0.95
    anomaly-sigma: 3.0
    tracking-signal-threshold: 4.0
    forecast-days: 3
